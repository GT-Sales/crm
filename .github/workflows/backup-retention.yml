# To add a deployment: one matrix entry here and in the two sibling workflows,
# three GitHub Environments named after it, their secrets per docs/ENV.md.
#
# Prunes each deployment's archive to 30 daily and 12 monthly restore points
# (docs/RUNBOOKS/backup.md). It holds the retention key (list, read and
# delete) and never the writer's key or the recovery private key: it works
# from the archive listing alone and decrypts nothing, so no environment holds
# both a delete-capable key and the means to read a backup. A scheduled run
# deletes; a manual run is a dry run unless "Dry run" is unticked.
name: Backup retention
on:
  schedule:
    # Weekly is enough: nothing depends on same-day pruning.
    - cron: '43 7 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (report planned deletions without deleting)'
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  retention:
    strategy:
      fail-fast: false
      matrix:
        deployment: [gt-sales]
    environment: backup-${{ matrix.deployment }}
    concurrency:
      group: backup-retention-${{ matrix.deployment }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run retention (scheduled runs delete, manual runs default to a dry run)
        env:
          # A scheduled run deletes with no one watching. The safety is the
          # policy itself, not an approval: 30 daily and 12 monthly points are
          # always kept, nothing younger than the 24-hour grace is touched, a
          # run counts only once its manifest (uploaded last) exists, and the
          # heartbeat is never deleted. A human reads the dry-run report once,
          # at setup (docs/RUNBOOKS/backup.md step 7), not every Monday. A
          # manual run keeps the dry_run input, default true.
          RETENTION_DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || (github.event.inputs.dry_run == 'false' && 'false' || 'true') }}
          BACKUP_DEPLOYMENT: ${{ matrix.deployment }}
          # The retention key: listFiles, readFiles and deleteFiles.
          B2_ARCHIVE_ENDPOINT: ${{ secrets.B2_ARCHIVE_ENDPOINT }}
          B2_ARCHIVE_REGION: ${{ secrets.B2_ARCHIVE_REGION }}
          B2_ARCHIVE_BUCKET: ${{ secrets.B2_ARCHIVE_BUCKET }}
          B2_ARCHIVE_RETENTION_KEY_ID: ${{ secrets.B2_ARCHIVE_KEY_ID }}
          B2_ARCHIVE_RETENTION_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_APPLICATION_KEY }}
          # Optional; unset secrets arrive empty and the defaults apply.
          RETENTION_DAILY_POINTS: ${{ secrets.RETENTION_DAILY_POINTS }}
          RETENTION_MONTHLY_POINTS: ${{ secrets.RETENTION_MONTHLY_POINTS }}
          RETENTION_GRACE_SECONDS: ${{ secrets.RETENTION_GRACE_SECONDS }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          RELEASE_SHA: ${{ github.sha }}
          DEPLOYMENT_ENV: production
        run: pnpm --filter @gt-sales/jobs run retention
