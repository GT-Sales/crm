# To add a deployment: one matrix entry here and in the two sibling workflows,
# three GitHub Environments named after it, their secrets per docs/ENV.md.
#
# Prunes each deployment's archive to 30 daily and 12 monthly restore points
# (docs/RUNBOOKS/backup.md). It holds the retention key (list, read and
# delete) and never the writer's key or the recovery private key: it works
# from the archive listing alone and decrypts nothing, so no environment holds
# both a delete-capable key and the means to read a backup. It reports
# without deleting unless it is run by hand with "Dry run" unchecked.
name: Backup retention
on:
  schedule:
    # Weekly is enough: nothing depends on same-day pruning.
    - cron: '43 7 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (report planned deletions without deleting)'
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  retention:
    strategy:
      fail-fast: false
      matrix:
        deployment: [gt-sales]
    # The environment requires the owner's approval before each run.
    environment: backup-retention-${{ matrix.deployment }}
    concurrency:
      group: backup-retention-${{ matrix.deployment }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run retention (a dry run unless explicitly disabled)
        env:
          # Only a manual run with the box unchecked deletes; a scheduled run
          # has no input and is always a dry run.
          RETENTION_DRY_RUN: ${{ github.event.inputs.dry_run == 'false' && 'false' || 'true' }}
          BACKUP_DEPLOYMENT: ${{ matrix.deployment }}
          # The retention key: listFiles, readFiles and deleteFiles.
          B2_ARCHIVE_ENDPOINT: ${{ secrets.B2_ARCHIVE_ENDPOINT }}
          B2_ARCHIVE_REGION: ${{ secrets.B2_ARCHIVE_REGION }}
          B2_ARCHIVE_BUCKET: ${{ secrets.B2_ARCHIVE_BUCKET }}
          B2_ARCHIVE_RETENTION_KEY_ID: ${{ secrets.B2_ARCHIVE_RETENTION_KEY_ID }}
          B2_ARCHIVE_RETENTION_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_RETENTION_APPLICATION_KEY }}
          # Optional; unset secrets arrive empty and the defaults apply.
          RETENTION_DAILY_POINTS: ${{ secrets.RETENTION_DAILY_POINTS }}
          RETENTION_MONTHLY_POINTS: ${{ secrets.RETENTION_MONTHLY_POINTS }}
          RETENTION_GRACE_SECONDS: ${{ secrets.RETENTION_GRACE_SECONDS }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          RELEASE_SHA: ${{ github.sha }}
          DEPLOYMENT_ENV: production
        run: pnpm --filter @gt-sales/jobs run retention
