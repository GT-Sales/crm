# To add a deployment: one matrix entry here and in the two sibling workflows,
# one GitHub Environment named backup-<deployment> (all three workflows use
# it), its secrets per docs/ENV.md, and its auth_data below (include, unless
# its Supabase project keeps row security on auth.users and auth.identities,
# as gt-sales's does).
#
# The nightly backup of each deployment: an encrypted copy of its database and
# every verified document, written to its Backblaze B2 archive
# (docs/RUNBOOKS/backup.md). Owner decision 2026-11-06: the environment holds
# ONE bucket-only B2 key (Read and Write, no delete beyond Write's overwrite)
# in B2_ARCHIVE_KEY_ID / B2_ARCHIVE_APPLICATION_KEY, which this job passes as
# the "writer" key; the monitor and retention jobs pass the same key as their
# reader and retention keys. So this job's key CAN also read and overwrite
# archives: the 30-day Object Lock (governance mode) is what protects the last
# month of restore points, and the older monthly points have no such
# protection. It also holds the public recovery recipient, never the private
# key. Retention runs from a separate workflow (backup-retention.yml).
name: Backup
on:
  schedule:
    # 06:17 UTC daily: an off-peak, non-round minute so the run does not queue
    # behind every other project's on-the-hour schedule.
    - cron: '17 6 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  backup:
    strategy:
      fail-fast: false
      matrix:
        deployment: [gt-sales]
        include:
          # gt-sales: Supabase keeps row security on auth.users and
          # auth.identities and postgres cannot grant USAGE on auth, so
          # backup_reader would read both as empty and the completeness guard
          # would stop the run (docs/RUNBOOKS/backup.md step 5, check 4 and 5,
          # 2026-10-29). Staff are re-invited after a restore.
          - deployment: gt-sales
            auth_data: skip
    # One GitHub Environment per deployment scopes its secrets to this job.
    # Its secrets are set in the repository settings, never in this file.
    environment: backup-${{ matrix.deployment }}
    concurrency:
      group: backup-${{ matrix.deployment }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install PostgreSQL 17 client tools (pg_dump, pg_dumpall, psql)
        # The dump runs pg_dump/pg_dumpall directly (jobs/src/backup/pg-dump.ts)
        # as the read-only backup_reader login. pg_dump must be at least the
        # server's major version (Postgres 17.6, docs/RUNBOOKS/backup.md
        # "Facts"), and Ubuntu 24.04 ships 16, so the client comes from the
        # PostgreSQL project's own apt repository.
        run: |
          # The runner's Ubuntu mirror sometimes fails to resolve for a moment
          # (2026-11-11 backup lost); apt retries instead of failing the job.
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Install age (encrypts every artifact and the manifest before upload)
        run: |
          for attempt in 1 2 3 4 5; do
            sudo apt-get install -y age && break
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep $((attempt * 15))
          done
      - name: Record the tool versions this run is taken with (for the manifest)
        run: |
          pg_dump --version | grep -q '(PostgreSQL) 17'
          echo "AGE_VERSION=$(age --version 2>&1 | head -n 1)" >> "$GITHUB_ENV"
          echo "PG_DUMP_VERSION=$(pg_dump --version 2>&1 | head -n 1)" >> "$GITHUB_ENV"
      - name: Run the backup
        env:
          BACKUP_DEPLOYMENT: ${{ matrix.deployment }}
          AGE_VERSION: ${{ env.AGE_VERSION }}
          PG_DUMP_VERSION: ${{ env.PG_DUMP_VERSION }}
          # The source: backup_reader through the session pooler, and a
          # Storage S3 key pair of its own. The job only reads with it;
          # Supabase S3 keys cannot be limited to reading, so it is a
          # separate key only so it can be revoked on its own.
          SOURCE_DATABASE_URL: ${{ secrets.SOURCE_DATABASE_URL }}
          SOURCE_STORAGE_ENDPOINT: ${{ secrets.SOURCE_STORAGE_ENDPOINT }}
          SOURCE_STORAGE_REGION: ${{ secrets.SOURCE_STORAGE_REGION }}
          SOURCE_STORAGE_BUCKET: ${{ secrets.SOURCE_STORAGE_BUCKET }}
          SOURCE_STORAGE_ACCESS_KEY_ID: ${{ secrets.SOURCE_STORAGE_ACCESS_KEY_ID }}
          SOURCE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.SOURCE_STORAGE_SECRET_ACCESS_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          # The public recovery recipient only, never the private key.
          RECOVERY_AGE_RECIPIENT: ${{ secrets.RECOVERY_AGE_RECIPIENT }}
          # The archive writer key: listFiles and writeFiles, nothing else.
          B2_ARCHIVE_ENDPOINT: ${{ secrets.B2_ARCHIVE_ENDPOINT }}
          B2_ARCHIVE_REGION: ${{ secrets.B2_ARCHIVE_REGION }}
          B2_ARCHIVE_BUCKET: ${{ secrets.B2_ARCHIVE_BUCKET }}
          B2_ARCHIVE_WRITER_KEY_ID: ${{ secrets.B2_ARCHIVE_KEY_ID }}
          B2_ARCHIVE_WRITER_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_APPLICATION_KEY }}
          # Optional; unset secrets arrive empty and the defaults apply.
          # BACKUP_AUTH_DATA falls back to the deployment's matrix value.
          BACKUP_AUTH_DATA: ${{ secrets.BACKUP_AUTH_DATA || matrix.auth_data }}
          BACKUP_HISTORY: ${{ secrets.BACKUP_HISTORY }}
          BACKUP_MAX_SNAPSHOT_BYTES: ${{ secrets.BACKUP_MAX_SNAPSHOT_BYTES }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          RELEASE_SHA: ${{ github.sha }}
          DEPLOYMENT_ENV: production
        run: pnpm --filter @gt-sales/jobs run backup
# No delete-capable credential is ever present in this workflow.
