version: 2
# The repository runs `pnpm audit --prod --audit-level=high` in CI, so a
# published advisory fails the build; these updates are what keeps that step
# quiet without a manual sweep. Weekly and grouped: a handful of reviewable pull
# requests, not one per package.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Toronto
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      production-patch:
        applies-to: version-updates
        dependency-type: production
        update-types: [patch]
      production-minor:
        applies-to: version-updates
        dependency-type: production
        update-types: [minor]
      development:
        applies-to: version-updates
        dependency-type: development
        update-types: [patch, minor]
    ignore:
      # A major upgrade of these needs a planned change, not a drip feed.
      - dependency-name: node
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: next
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Toronto
    open-pull-requests-limit: 3
    groups:
      actions:
        applies-to: version-updates
        patterns: ['*']
